name: Gerar animação da cobrinha

on:
  # Roda a cada 12 horas
  schedule:
    - cron: "0 */12 * * *"
  # Roda a cada push na branch main
  push:
    branches:
      - main
  # Permite rodar manualmente pela aba Actions
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    name: Gerar snake.svg
    runs-on: ubuntu-latest

    steps:
      - name: Gerar a animação a partir das contribuições
        uses: Platane/snk@v3
        id: snake-gif
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake.svg
            dist/snake-dark.svg?palette=github-dark

      - name: Publicar o resultado na branch output
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
